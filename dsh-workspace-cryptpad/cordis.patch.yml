# dsh-workspace-cryptpad bundle patch: add the CryptPad widget plugin.
# 依赖 workspace 服务：把「CryptPad」widget 注册进 dsh-workspace-sidebar 工作台（center 区域）。
# host 半注册 /_dsh/desktop/cryptpad{,/settings} 路由（与旧的 dsh-plugin-cryptpad sidecar 互斥，须先移除它）。
# 防双挂载守卫：聚合 bundle 若已用其它 id 挂载本包则自动退让。
- insert:
    - id: dsh-workspace-cryptpad
      name: 'dsh-workspace-cryptpad'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-workspace-cryptpad' && e.options.id !== 'dsh-workspace-cryptpad' && !e.disabled)"
